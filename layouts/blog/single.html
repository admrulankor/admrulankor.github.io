{{ define "main" }}
<article class="mx-auto max-w-3xl px-4 py-12 sm:px-6 sm:py-16">
  <header class="mb-10 border-b border-slate-200/80 pb-8 dark:border-accent-500/15">
    <p class="mb-2 font-display text-[0.65rem] font-black uppercase tracking-[0.25em] text-accent-500">
      Transmission
    </p>
    <h1 class="text-3xl text-slate-900 dark:text-slate-50 sm:text-4xl text-glow text-balance">
      {{ .Title }}
    </h1>
    <div class="mt-4 flex flex-wrap items-center gap-3 text-sm text-slate-500 dark:text-slate-400">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.author }}
        <span aria-hidden="true">·</span>
        <span>{{ . }}</span>
      {{ end }}
      <span aria-hidden="true">·</span>
      <span>{{ .ReadingTime }} min read</span>
    </div>
    {{ partial "tags.html" (dict "page" . "class" "mt-4") }}
  </header>

  <div class="prose-scifi">
    {{ .Content }}
  </div>

  <footer class="mt-12 border-t border-slate-200/80 pt-8 dark:border-accent-500/15">
    <a href="{{ "blog/" | relURL }}" class="btn-ghost">← Back to blog</a>
  </footer>
</article>
{{ end }}
