<article class="post-preview">
  <p class="section-label mb-3">Project</p>
  <h2><a href="{{ .RelPermalink }}" class="text-slate-900 no-underline transition-colors hover:text-accent-600 dark:text-slate-50 dark:hover:text-accent-400">{{ .Title }}</a></h2>
  <p class="mt-3 text-base leading-relaxed text-slate-600 dark:text-slate-400">{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 180 }}{{ end }}</p>
  {{ partial "tags.html" (dict "page" . "limit" 3 "class" "mt-4") }}
</article>
