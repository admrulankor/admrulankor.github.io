<article class="editorial-panel group flex h-full flex-col overflow-hidden">
  {{ with .Params.image }}
    <a href="{{ $.RelPermalink }}" class="block overflow-hidden border-b border-slate-200/80 dark:border-slate-700/60" tabindex="-1" aria-hidden="true">
      <img src="{{ . | relURL }}" alt="" class="aspect-[16/10] w-full object-cover object-top" loading="lazy" decoding="async">
    </a>
  {{ end }}
  <div class="flex flex-1 flex-col p-5">
    <p class="section-label mb-3">Project</p>
    <h2 class="text-2xl leading-tight"><a href="{{ .RelPermalink }}" class="text-slate-900 no-underline transition-colors hover:text-accent-600 dark:text-slate-50 dark:hover:text-accent-400">{{ .Title }}</a></h2>
    <p class="mt-3 flex-1 text-sm leading-relaxed text-slate-600 dark:text-slate-400">{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 150 }}{{ end }}</p>
    {{ partial "tags.html" (dict "page" . "limit" 3 "class" "mt-4") }}
    <a href="{{ .RelPermalink }}" class="nav-link mt-5 inline-flex items-center gap-2" aria-label="View project: {{ .Title }}">View project <span aria-hidden="true">→</span></a>
  </div>
</article>
