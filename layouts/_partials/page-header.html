<header class="signal-rule mb-10 border-b border-slate-200 pb-8 dark:border-slate-700/60">
  <div class="flex flex-wrap items-start justify-between gap-5">
    <div class="min-w-0 flex-1">
      {{ with .eyebrow }}<p class="section-label mb-3">{{ . }}</p>{{ end }}
      <h1 class="text-4xl leading-tight text-slate-900 dark:text-slate-50 sm:text-5xl">{{ .title }}</h1>
      {{ with .subtitle }}<p class="mt-4 max-w-2xl text-lg leading-relaxed text-slate-600 dark:text-slate-400">{{ . }}</p>{{ end }}
    </div>
    {{ with .rssPage }}{{ partial "rss-link.html" (dict "page" . "label" "RSS") }}{{ end }}
  </div>
</header>
