# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — Hugo personal site (rulankor)
# Backend: self-hosted GitLab (forge.lokifrak.com) with PKCE OAuth
#
# Setup required once (GitLab OAuth app) — see backend.app_id comments below.

backend:
  name: gitlab
  repo: admrulankor/personal-site
  branch: main
  # Self-hosted GitLab
  base_url: https://forge.lokifrak.com
  api_root: https://forge.lokifrak.com/api/v4
  # PKCE enables the "Login with GitLab" button (recommended)
  auth_type: pkce
  # Paste the Application ID from your GitLab OAuth app:
  #   https://forge.lokifrak.com/-/user_settings/applications
  #   (or Admin → Applications for an instance-wide app)
  #
  # App settings:
  #   Name:           Rulankor Sveltia CMS
  #   Redirect URI:   https://rulankor.lokifrak.com/admin/
  #                   http://localhost:1313/admin/   (optional, for local hugo server)
  #   Confidential:   unchecked (OFF)
  #   Scopes:         api
  app_id: 1e570dc8dcf1f7f9efc0bd1e011ffeeadd6f3a861060bd90c706e86bd7a67a56
  # Prefer OAuth; token login remains available as a fallback until app_id is set.
  auth_methods: [oauth, token]

# Site identity (used by CMS for links / previews)
site_url: https://rulankor.lokifrak.com
display_url: https://rulankor.lokifrak.com
logo_url: https://rulankor.lokifrak.com/

# Media uploads live under static/ and are served at /images/...
media_folder: static/images
public_folder: /images

locale: en

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Omit empty optional front matter keys on save
output:
  omit_empty_optional_fields: true

collections:
  # ---------------------------------------------------------------------------
  # Blog posts → content/blog/*.md  (+ _index.md via index_file)
  # ---------------------------------------------------------------------------
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} — {{date}}"
    sortable_fields:
      fields: [title, date, draft]
      default:
        field: date
        direction: descending
    view_filters:
      - label: Drafts
        field: draft
        pattern: "true"
      - label: Published
        field: draft
        pattern: "false"
    index_file:
      name: _index
      label: Blog section
      icon: article
      fields:
        - name: title
          label: Title
          widget: string
        - name: description
          label: Description
          widget: text
          required: false
        - name: outputs
          label: Outputs
          widget: list
          required: false
          default: [HTML, RSS]
          field:
            name: output
            label: Output
            widget: string
        - name: body
          label: Body
          widget: markdown
          required: false
    fields:
      - name: title
        label: Title
        widget: string
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: draft
        label: Draft
        widget: boolean
        default: true
      - name: description
        label: Description
        widget: text
        required: false
        hint: Short summary for cards, meta description, and RSS.
      - name: tags
        label: Tags
        widget: list
        required: false
        field:
          name: tag
          label: Tag
          widget: string
      - name: author
        label: Author
        widget: string
        default: Gibran Alfaro
        required: false
      - name: body
        label: Body
        widget: markdown

  # ---------------------------------------------------------------------------
  # Portfolio projects → content/portfolio/*.md  (+ _index.md via index_file)
  # ---------------------------------------------------------------------------
  - name: portfolio
    label: Portfolio
    label_singular: Project
    folder: content/portfolio
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} (weight {{weight}})"
    sortable_fields:
      fields: [title, date, weight, draft]
      default:
        field: weight
        direction: ascending
    index_file:
      name: _index
      label: Portfolio section
      icon: work
      fields:
        - name: title
          label: Title
          widget: string
        - name: description
          label: Description
          widget: text
          required: false
        - name: outputs
          label: Outputs
          widget: list
          required: false
          default: [HTML, RSS]
          field:
            name: output
            label: Output
            widget: string
        - name: body
          label: Body
          widget: markdown
          required: false
    fields:
      - name: title
        label: Title
        widget: string
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: weight
        label: Weight
        widget: number
        value_type: int
        default: 99
        min: 1
        max: 999
        hint: Lower numbers appear first on the portfolio list.
      - name: draft
        label: Draft
        widget: boolean
        default: true
      - name: description
        label: Description
        widget: text
        required: false
      - name: tags
        label: Tags
        widget: list
        required: false
        field:
          name: tag
          label: Tag
          widget: string
      - name: image
        label: Hero image
        widget: image
        required: false
        choose_url: false
        media_folder: static/images/portfolio
        public_folder: /images/portfolio
        hint: Card + project hero (e.g. /images/portfolio/my-project/hero.png).
      - name: images
        label: Gallery images
        widget: list
        required: false
        summary: "{{fields.image}}"
        field:
          name: image
          label: Image
          widget: image
          choose_url: false
          media_folder: static/images/portfolio
          public_folder: /images/portfolio
      - name: demo
        label: Live demo URL
        widget: string
        required: false
        hint: Leave empty to hide the Live demo button.
      - name: repo
        label: Source code URL
        widget: string
        required: false
        hint: Leave empty to hide the Source code button.
      - name: meta
        label: Project meta
        widget: keyvalue
        required: false
        key_label: Label
        value_label: Value
        hint: Free-form key/value panel (Role, Stack, Client, Studio, Medium, Year, …).
      - name: body
        label: Body
        widget: markdown

  # ---------------------------------------------------------------------------
  # Standalone pages
  # ---------------------------------------------------------------------------
  - name: pages
    label: Pages
    label_singular: Page
    files:
      - name: home
        label: Home
        file: content/_index.md
        fields:
          - name: title
            label: Title
            widget: string
          - name: body
            label: Body
            widget: markdown
            required: false
      - name: about
        label: About
        file: content/about.md
        fields:
          - name: title
            label: Title
            widget: string
          - name: description
            label: Description
            widget: text
            required: false
          - name: eyebrow
            label: Eyebrow
            widget: string
            required: false
            default: Identity
          - name: body
            label: Body
            widget: markdown
