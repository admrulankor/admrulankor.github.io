baseURL: https://rulankor.lokifrak.com/
locale: en-us
title: Gibran Alfaro

params:
  author: Gibran Alfaro
  description: Web developer and IP creator based in Jakarta — portfolio, projects, and writing from the edge of the network.
  tagline: Web Developer · IP Creator · Jakarta
  accent: orange
  social:
    instagram: https://instagram.com/admrulankor
    email: mailto:audioanimatronic1874@gmail.com
    phone: tel:+6289630744391

menu:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Portfolio
      pageRef: /portfolio
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - name: About
      pageRef: /about
      weight: 4

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    lineNos: false
    noClasses: false

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

caches:
  images:
    dir: :cacheDir/images

security:
  exec:
    allow:
      - '^(dart-)?sass(-embedded)?$'
      - '^go$'
      - '^git$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'   
      - '^node$'